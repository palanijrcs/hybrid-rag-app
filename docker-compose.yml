name: hybrid-rag-app
# Phase 20: backend + frontend.  From the project root:
#   docker compose up -d --build        (production-style)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   (live reload)
services:
  backend:
    build:
      context: ./backend
    container_name: hybrid-rag-backend
    env_file: .env
    environment:
      UPLOAD_DIR: data/uploads
      FAISS_INDEX_PATH: data/faiss
    ports:
      - "${BACKEND_BIND:-8000}:8000"     # VPS: 127.0.0.1:8100 (private)
    volumes:
      - ./data:/app/data                 # uploads, FAISS, chunks survive restarts
      - ./evaluation:/app/evaluation     # golden dataset + saved runs
      - ./logs:/app/logs
      - model-cache:/models              # embedding + re-ranker models, downloaded once
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: hybrid-rag-frontend
    environment:
      BACKEND_URL: http://backend:8000   # container-to-container name
      PUBLIC_MODE: ${PUBLIC_MODE:-false}  # VPS: true = visitors can only ask questions
    ports:
      - "${FRONTEND_BIND:-8501}:8501"    # VPS: 127.0.0.1:8601 (nginx in front)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-cache:
