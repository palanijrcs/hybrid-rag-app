# Phase 21: run the offline tests and build the Docker images on every push / PR.
# No secrets are needed: tests that call OpenAI or Neo4j are marked "live" and skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            frontend/requirements.txt

      - name: Install backend dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Backend tests (offline, no model downloads)
        working-directory: backend
        run: python -m pytest -m "not slow and not live" --cov=app --cov-report=term -q

      - name: Frontend tests
        working-directory: frontend
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t hybrid-rag-backend ./backend
          docker build -t hybrid-rag-frontend ./frontend
