services:
  backend:
    build:
      context: ./backend
    container_name: hybrid-rag-backend
    env_file:
      - .env
    environment:
      # Paths as seen from inside the container
      UPLOAD_DIR: data/uploads
      FAISS_INDEX_PATH: data/faiss
    ports:
      - "8000:8000"
    volumes:
      # Your data lives on the laptop, so it survives container restarts
      - ./data:/app/data
      # Live code reload while developing
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      # Keep the downloaded embedding model between restarts
      - model-cache:/models
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  model-cache: