[pytest]
# Phase 19: one place for test settings.  Run from backend/:  python -m pytest
testpaths = tests
addopts = -ra -m "not live"
markers =
    slow: loads real ML models (embeddings, cross-encoder); skip with -m "not slow and not live"
    live: calls real OpenAI/Neo4j (costs money); run with RUN_LIVE_TESTS=1 python -m pytest -m live
filterwarnings =
    ignore:.*on_event is deprecated.*:DeprecationWarning
