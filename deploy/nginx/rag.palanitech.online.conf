# Phase 22: nginx site for the Hybrid RAG app.
# Install:  cp deploy/nginx/rag.palanitech.online.conf /etc/nginx/sites-available/
#           ln -s /etc/nginx/sites-available/rag.palanitech.online.conf /etc/nginx/sites-enabled/
# HTTPS is added afterwards by:  certbot --nginx -d rag.palanitech.online

map $http_upgrade $rag_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.palanitech.online;

    # Uploads (PDF/DOCX) up to 50 MB
    client_max_body_size 50m;

    # The app has no login of its own: protect it (and your OpenAI budget) with a password
    auth_basic "Hybrid RAG";
    auth_basic_user_file /etc/nginx/.htpasswd-rag;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Streamlit UI (uses WebSockets). The API on 127.0.0.1:8100 stays private.
    location / {
        proxy_pass http://127.0.0.1:8601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rag_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # long answers / large uploads
        proxy_send_timeout 300s;
    }
}
